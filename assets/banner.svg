<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 48px;
      fill: url(#text-grad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #f8fafc;
    }
    
    /* Dynamic Animations */
    @keyframes pulse-glow {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes float-slow {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes dash-wave {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    .animated-bg-circle {
      animation: pulse-glow 6s infinite ease-in-out;
      transform-origin: center;
    }
    .wave-line {
      stroke-dasharray: 20 10;
      animation: dash-wave 30s linear infinite;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Dynamic Animated Background Elements (Positioned safely in background) -->
  <circle class="animated-bg-circle" cx="150" cy="80" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle class="animated-bg-circle" cx="1050" cy="240" r="200" fill="#ec4899" opacity="0.15" filter="url(#glow)" />
  
  <!-- Math Graph Wave Overlay (Background Accent) -->
  <path class="wave-line" d="M 0,220 Q 300,120 600,220 T 1200,220" fill="none" stroke="url(#accent-grad)" stroke-width="3" opacity="0.4"/>
  <path class="wave-line" d="M 0,260 Q 300,300 600,200 T 1200,240" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.25"/>

  <!-- Decorative Math Formulas (Subtle background graphics) -->
  <g fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-linecap="round">
    <!-- Integral sign -->
    <path d="M 950 60 C 960 40 970 40 965 70 L 955 130 C 950 160 960 160 970 140" />
    <!-- Square root -->
    <path d="M 80 240 L 95 240 L 105 270 L 125 220 L 170 220" />
  </g>
  
  <text x="135" y="245" fill="rgba(255,255,255,0.12)" font-family="sans-serif" font-size="22" font-weight="bold">x² + y² = r²</text>
  <text x="980" y="105" fill="rgba(255,255,255,0.12)" font-family="sans-serif" font-size="24" font-weight="bold">f'(x) = dx/dy</text>

  <!-- Content Layer (Foreground - Guaranteed crisp readability) -->
  <g transform="translate(60, 0)">
    <!-- Top Pill / Badge -->
    <g transform="translate(0, 48)">
      <rect width="260" height="32" rx="16" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1"/>
      <circle cx="16" cy="16" r="6" fill="#10b981"/>
      <text x="32" y="21" class="badge-text">📐 CURATED MATH ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" class="title">Awesome Educational Math Solver</text>
    
    <!-- Subtitle -->
    <text x="0" y="175" class="subtitle">Step-by-Step Solvers • Computer Algebra Systems (CAS) • Graphing &amp; Interactive Math</text>

    <!-- Feature Tags / Bottom Pills -->
    <g transform="translate(0, 220)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="170" height="36" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="18" y="23" class="badge-text" fill="#cbd5e1">☁️ SaaS Solutions</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(185, 0)">
        <rect width="210" height="36" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="18" y="23" class="badge-text" fill="#cbd5e1">🔓 100% Open Source</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(410, 0)">
        <rect width="210" height="36" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="18" y="23" class="badge-text" fill="#cbd5e1">📊 Market Data &amp; Stars</text>
      </g>
    </g>
  </g>
</svg>
